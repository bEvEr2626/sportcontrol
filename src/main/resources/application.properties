spring.application.name=sportcontrol

spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USER:}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.devtools.restart.enabled=false

spring.sql.init.mode=never